<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hotel Mountain View | Admin Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f3ef;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 40px;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.10);
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h1 {
      color: #12304a;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .logo p {
      color: #777;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #333;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 20px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #12304a;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #12304a;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.92;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      <h1>Hotel Mountain View</h1>
      <p>Admin / CRM Login</p>
    </div>

    <form id="loginForm">

      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="Admin email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Password"
        required
      >

      <button type="submit">Login to Dashboard</button>

      <div id="message"></div>

    </form>

  </div>

  <script>

    const SUPABASE_URL = "https://dbtbedwlzvxpgerdvuko.supabase.co";

    const SUPABASE_ANON_KEY = "sb_publishable_ieBCUpH-QXINaYWDJfQJEg_tGiA6JNA";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    document
      .getElementById("loginForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const message = document.getElementById("message");

        message.textContent = "Logging in...";

        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) {
          message.textContent = error.message;
          return;
        }

        message.textContent = "Login successful!";

        window.location.href = "dashboard.html";

      });

  </script>

</body>
</html>
